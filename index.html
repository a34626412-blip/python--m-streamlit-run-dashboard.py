<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>CHIPS Boost Live v12</title>
<style>
:root{
  --bg:#0f1318;--bg2:#111720;--nav:#171c24;--card:#1e2630;--card2:#151b23;
  --line:#283240;--line2:#344150;--text:#fff;--muted:#9199a6;--muted2:#b7bfc9;
  --green:#00b75c;--green2:#01dc6f;--green3:#20ef88;--greenbg:rgba(0,183,92,.11);
  --blue:#246bfd;--shadow:0 8px 28px rgba(0,0,0,.24)
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:var(--bg);color:var(--text);font-family:Poppins,Inter,Segoe UI,Arial,sans-serif;-webkit-font-smoothing:antialiased}
body{background:radial-gradient(900px 420px at 20% -10%,rgba(0,183,92,.09),transparent 60%),var(--bg)}
a{text-decoration:none;color:inherit}
.app{min-height:100vh}
.nav{height:70px;background:rgba(23,28,36,.98);border-bottom:1px solid var(--line);display:flex;align-items:center}
.nav-inner{width:min(1180px,calc(100% - 32px));margin:auto;display:flex;align-items:center;gap:28px}
.logo{width:112px;height:auto;display:block}
.nav-item{height:70px;display:flex;align-items:center;padding:0 14px;color:var(--muted2);font-size:14px;font-weight:600;position:relative}
.nav-item.active{color:#fff}.nav-item.active:after{content:"";position:absolute;left:12px;right:12px;bottom:-1px;height:2px;background:var(--green2);box-shadow:0 0 12px rgba(1,220,111,.35)}
.live{margin-left:auto;display:flex;align-items:center;gap:8px;border:1px solid #2b3948;background:#121922;border-radius:999px;padding:9px 13px;font-size:12px;font-weight:600;color:#d9e0e8}
.live-dot{width:8px;height:8px;border-radius:50%;background:var(--green2);box-shadow:0 0 10px rgba(32,239,136,.7)}
.wrap{width:min(1180px,calc(100% - 32px));margin:0 auto;padding:26px 0 50px}
.hero{display:flex;align-items:flex-end;justify-content:space-between;gap:20px;margin:4px 0 22px}
.eyebrow{color:var(--green2);font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;margin-bottom:5px}
h1{font-size:28px;line-height:1.15;margin:0;font-weight:800;letter-spacing:-.02em}.sub{color:var(--muted);font-size:12px;margin-top:6px}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:16px}
.stat{background:var(--nav);border:1px solid var(--line);border-radius:10px;padding:14px 16px;box-shadow:var(--shadow)}
.label{color:#7f8b9b;font-size:10px;text-transform:uppercase;letter-spacing:.09em;font-weight:600}.value{font-size:22px;font-weight:800;margin-top:3px;letter-spacing:-.01em}
.panel{background:var(--nav);border:1px solid var(--line);border-radius:10px;overflow:hidden;box-shadow:var(--shadow)}
.panel-head{height:58px;padding:0 18px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--line)}
.panel-title{display:flex;align-items:center;gap:10px;font-size:15px;font-weight:700}.panel-dot{width:10px;height:10px;border-radius:50%;background:var(--green2);box-shadow:0 0 12px rgba(32,239,136,.35)}
.count{font-size:12px;color:var(--muted)}
.cards{padding:10px}
.card{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:20px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:8px;padding:16px 17px;margin-bottom:9px;transition:border-color .15s,transform .15s,background .15s}
.card:last-child{margin-bottom:0}.card:hover{border-color:#3a495a;background:#202a35;transform:translateY(-1px)}
.meta{display:flex;align-items:center;gap:8px;min-width:0;color:#8d98a8;font-size:11px;margin-bottom:7px;white-space:nowrap;overflow:hidden}.meta span{overflow:hidden;text-overflow:ellipsis}.sep{color:#4b5665}
.event{font-size:17px;font-weight:750;line-height:1.25;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.start{font-size:12px;color:var(--muted2);margin-top:6px}
.right{display:flex;flex-direction:column;align-items:flex-end;gap:10px}.boost{font-size:22px;line-height:1;font-weight:850;color:var(--green3);text-shadow:0 0 18px rgba(32,239,136,.12);white-space:nowrap}.boost small{font-size:11px;color:#8f9aa8;font-weight:600;margin-left:4px}
.open{display:inline-flex;align-items:center;justify-content:center;min-width:126px;height:36px;padding:0 14px;border-radius:7px;background:linear-gradient(180deg,var(--green2),var(--green));color:#07130c;font-size:12px;font-weight:800;box-shadow:0 4px 14px rgba(0,183,92,.15);transition:filter .15s,transform .15s}.open:hover{filter:brightness(1.08);transform:translateY(-1px)}
.empty{padding:70px 20px;text-align:center;color:var(--muted);font-size:13px}.empty strong{display:block;color:#dce2e8;font-size:14px;margin-bottom:5px}
.alert{position:fixed;right:20px;bottom:20px;display:none;align-items:center;gap:10px;background:#17221d;border:1px solid #247b4c;border-radius:8px;padding:12px 15px;box-shadow:0 12px 34px rgba(0,0,0,.45);font-size:13px;font-weight:650}.alert.show{display:flex}.alert-dot{width:8px;height:8px;border-radius:50%;background:var(--green2);box-shadow:0 0 10px rgba(32,239,136,.6)}
.pulse{animation:pulse .7s ease 2}@keyframes pulse{50%{border-color:#2b8d59;box-shadow:0 0 0 4px rgba(0,183,92,.07),var(--shadow)}}
@media(max-width:720px){.nav-inner{width:calc(100% - 20px);gap:8px}.logo{width:92px}.nav-item{display:none}.live{padding:8px 10px}.wrap{width:calc(100% - 20px);padding-top:18px}.hero{align-items:flex-start;flex-direction:column}h1{font-size:24px}.stats{grid-template-columns:1fr}.card{grid-template-columns:1fr;gap:12px}.right{flex-direction:row;align-items:center;justify-content:space-between}.boost{font-size:20px}.open{min-width:116px}.event{font-size:16px}}
</style>
</head>
<body>
<div class="app">
  <header class="nav">
    <div class="nav-inner">
      <img class="logo" src="/static/chips-white.svg" alt="CHIPS">
      <div class="live"><span class="live-dot" id="liveDot"></span><span id="status">Подключение…</span></div>
    </div>
  </header>

  <div class="wrap">
    <section class="hero">
      <div><div class="eyebrow">Live scanner</div><h1>CHIPS Boost Live</h1><div class="sub">Только актуальные будущие события с Boost · обновление каждую секунду</div></div>
    </section>

    <section class="stats">
      <div class="stat"><div class="label">Boost-событий</div><div class="value" id="total">0</div></div>
      <div class="stat"><div class="label">Последнее сканирование</div><div class="value" id="lastScan">—</div></div>
    </section>

    <main class="panel" id="mainPanel">
      <div class="panel-head"><div class="panel-title"><span class="panel-dot"></span><span>Забустированные события</span></div><div class="count" id="count">0 событий</div></div>
      <div class="cards" id="cards"><div class="empty"><strong>Подключение к сканеру…</strong>Ожидаем данные Boost.</div></div>
    </main>
  </div>
</div>
<div id="alert" class="alert"><span class="alert-dot"></span><span>Новый Boost найден</span></div>

<script>
let previousSig='';let first=true;
const esc=s=>String(s??'').replace(/[&<>\"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]));
function fmtTime(x){if(!x)return '—';return new Date(x).toLocaleTimeString('ru-RU',{hour:'2-digit',minute:'2-digit',second:'2-digit'});}
function fmtStart(x){if(!x)return '';return new Date(Number(x)*1000).toLocaleString('ru-RU',{day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'});}
function plural(n){if(n%10===1&&n%100!==11)return 'событие';if(n%10>=2&&n%10<=4&&(n%100<10||n%100>=20))return 'события';return 'событий';}
function signature(bs){return JSON.stringify(bs.map(x=>[x.event_id,x.multiplier]));}
function render(s){
  const ok=!!s.ok;document.getElementById('liveDot').style.background=ok?'#01dc6f':'#ff443d';document.getElementById('status').textContent=ok?'LIVE · API подключён':'API недоступен';
  document.getElementById('lastScan').textContent=fmtTime(s.last_scan);document.getElementById('total').textContent=s.boosts.length;document.getElementById('count').textContent=s.boosts.length+' '+plural(s.boosts.length);
  const cards=document.getElementById('cards');
  if(!s.boosts.length){cards.innerHTML='<div class="empty"><strong>Сейчас активных Boost-событий нет</strong>Сканер продолжает работать в фоне.</div>';}
  else{cards.innerHTML=s.boosts.map(b=>{
    const meta=[b.sport,b.category,b.tournament].filter(Boolean);const boost=Number(b.boost_percent);
    return `<article class="card"><div style="min-width:0"><div class="meta">${meta.map((x,i)=>`${i?'<span class="sep">·</span>':''}<span>${esc(x)}</span>`).join('')}</div><div class="event">${esc(b.event_name||'Предстоящее событие')}</div>${b.scheduled?`<div class="start">Начало · ${fmtStart(b.scheduled)}</div>`:''}</div><div class="right"><div class="boost">+${esc(Number.isInteger(boost)?boost:boost.toFixed(2))}%<small>BOOST</small></div><a class="open" href="${esc(b.event_url)}" target="_blank" rel="noopener">Открыть ставку</a></div></article>`;
  }).join('');}
  const sig=signature(s.boosts);if(!first&&sig!==previousSig){notifyNew();const p=document.getElementById('mainPanel');p.classList.add('pulse');setTimeout(()=>p.classList.remove('pulse'),1500);}previousSig=sig;first=false;
}
async function poll(){try{const r=await fetch('/api/state',{cache:'no-store'});render(await r.json());}catch(e){document.getElementById('status').textContent='Локальный сервер недоступен';}}
function notifyNew(){const a=document.getElementById('alert');a.classList.add('show');setTimeout(()=>a.classList.remove('show'),4200);try{const C=window.AudioContext||window.webkitAudioContext,c=new C(),o=c.createOscillator(),g=c.createGain();o.frequency.value=880;o.connect(g);g.connect(c.destination);g.gain.setValueAtTime(.001,c.currentTime);g.gain.exponentialRampToValueAtTime(.16,c.currentTime+.03);g.gain.exponentialRampToValueAtTime(.001,c.currentTime+.32);o.start();o.stop(c.currentTime+.36);}catch(e){}if('Notification'in window){if(Notification.permission==='granted')new Notification('🟢 CHIPS Boost найден',{body:'Появилось новое забустированное событие'});else if(Notification.permission==='default')Notification.requestPermission();}}
poll();setInterval(poll,1000);if('Notification'in window&&Notification.permission==='default')setTimeout(()=>Notification.requestPermission(),1200);
</script>
</body>
</html>
